openapi: 3.1.0
info:
  title: Resgata API
  version: 0.1.0
  description: |
    Contract for the Resgata demo. Fictional forecast, ROI, sponsor, coupon,
    and historical data is returned with `simulated: true` and the visible
    label `SIMULADO`.
servers:
  - url: /api
tags:
  - name: System
  - name: Demo session
  - name: Vision
  - name: Donations
  - name: Offers
  - name: Pickups
  - name: Coupons
  - name: Impact
  - name: Partner
  - name: Admin
  - name: Events
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service dependency health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /demo/users:
    get:
      tags: [Demo session]
      operationId: listDemoUsers
      security: []
      responses:
        "200":
          description: Seeded demo identities for the role picker.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DemoUser"

  /me:
    get:
      tags: [Demo session]
      operationId: getCurrentDemoUser
      responses:
        "200":
          description: Identity selected by X-Demo-User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDemoUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /vision/classify:
    post:
      tags: [Vision]
      operationId: classifyDonation
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyDonationRequest"
      responses:
        "200":
          description: >-
            Claude image analysis when ANTHROPIC_API_KEY is configured;
            otherwise a deterministic SIMULADO classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /donations:
    get:
      tags: [Donations]
      operationId: listDonations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DonationStatus"
      responses:
        "200":
          description: Donations visible to the selected demo user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Donations]
      operationId: createDonation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation and transactional outbox message were created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "200":
          description: Idempotent replay of the original successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /donations/{donationId}:
    parameters:
      - $ref: "#/components/parameters/DonationId"
    get:
      tags: [Donations]
      operationId: getDonation
      responses:
        "200":
          description: Donation detail with its ordered timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /donations/{donationId}/events:
    parameters:
      - $ref: "#/components/parameters/DonationId"
    get:
      tags: [Donations]
      operationId: listDonationEvents
      responses:
        "200":
          description: Ordered audit trail for one donation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DonationEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /offers:
    get:
      tags: [Offers]
      operationId: listOffers
      parameters:
        - $ref: "#/components/parameters/NgoIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OfferStatus"
      responses:
        "200":
          description: Offers visible to the selected NGO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /offers/{offerId}/accept:
    post:
      tags: [Offers]
      operationId: acceptOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDecisionRequest"
      responses:
        "200":
          description: Offer accepted through an atomic single-winner operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /offers/{offerId}/reject:
    post:
      tags: [Offers]
      operationId: rejectOffer
      parameters:
        - $ref: "#/components/parameters/OfferId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDecisionRequest"
      responses:
        "200":
          description: Offer declined; fallback dispatch continues asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDecisionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pickups:
    get:
      tags: [Pickups]
      operationId: listPickups
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PickupStatus"
      responses:
        "200":
          description: NGO receipts or driver collection tasks, scoped by role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pickups/{pickupId}/assign:
    post:
      tags: [Pickups]
      operationId: assignPickup
      parameters:
        - $ref: "#/components/parameters/PickupId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPickupRequest"
      responses:
        "200":
          description: Driver assigned to a pickup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /pickups/{pickupId}/collect:
    post:
      tags: [Pickups]
      operationId: confirmCollection
      parameters:
        - $ref: "#/components/parameters/PickupId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPickupRequest"
      responses:
        "200":
          description: Pickup code confirmed and donation moved to collected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /pickups/{pickupId}/deliver:
    post:
      tags: [Pickups]
      operationId: confirmDelivery
      parameters:
        - $ref: "#/components/parameters/PickupId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPickupRequest"
      responses:
        "200":
          description: Delivery code confirmed and donation moved to delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /coupons:
    get:
      tags: [Coupons]
      operationId: listCoupons
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Available simulated coupons for the selected driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /coupons/{couponId}/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      parameters:
        - $ref: "#/components/parameters/CouponId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: Simulated coupon redemption issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponRedemption"
        "200":
          description: Idempotent replay of the original redemption.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponRedemption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /metrics/impact:
    get:
      tags: [Impact]
      operationId: getSellerImpact
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seller impact calculated from donation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /impact/forecast:
    get:
      tags: [Impact]
      operationId: getSellerForecast
      responses:
        "200":
          description: Clearly labeled simulated forecast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedForecast"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /partner/dashboard:
    get:
      tags: [Partner]
      operationId: getPartnerDashboard
      responses:
        "200":
          description: Clearly labeled simulated sponsor and ROI dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /partners/{partnerId}/redemptions:
    get:
      tags: [Partner]
      operationId: listPartnerRedemptions
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Coupon redemptions owned by the authenticated partner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRedemptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ngos:
    get:
      tags: [Offers]
      operationId: listNgos
      responses:
        "200":
          description: Active NGOs available to receive matched donations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NgoList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dev/reset:
    post:
      tags: [Admin]
      operationId: resetDemo
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Local seeded state restored for another demo run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/code:
    post:
      tags: [Auth]
      operationId: requestLoginCode
      security: []
      description: >-
        Sends a 6-digit sign-in code through the notification channel
        (WhatsApp). Unknown numbers get the same response. `devCode` is only
        returned when ENABLE_DEV_LOGIN_CODES=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+5519999990001" }
      responses:
        "200":
          description: "Code sent (or silently ignored)."
        "429":
          description: "Too many codes requested."
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyLoginCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: Bearer session token and the signed-in user.
        "401":
          description: "Invalid or expired code."
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "200":
          description: "Session revoked."
  /photos/{photoId}:
    get:
      tags: [Vision]
      operationId: getPhoto
      security: []
      description: Analyzed donation photo; the random id acts as a capability link.
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Image bytes.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404": { $ref: "#/components/responses/NotFound" }
  /geo/cep/{cep}:
    get:
      tags: [Locations]
      operationId: getCepAddress
      description: ViaCEP address plus Nominatim coordinates; SIMULADO fallback offline.
      parameters:
        - { name: cep, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "GeocodeResult with address, source, and simulated flag."
        "404":
          description: "CEP or location not found."
  /geo/reverse:
    get:
      tags: [Locations]
      operationId: getReverseAddress
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lon, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: "GeocodeResult for a GPS position."
  /sellers/me:
    get:
      tags: [Locations]
      operationId: getSellerProfile
      responses:
        "200":
          description: "Seller id, legal name, and registered pickup address."
    post:
      tags: [Locations]
      operationId: updateSellerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: "Updated seller profile."
  /drivers/me:
    get:
      tags: [Pickups]
      operationId: getDriverStatus
      responses:
        "200":
          description: "Availability, vehicle capacity, and last location."
    post:
      tags: [Pickups]
      operationId: updateDriverStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
                location: { $ref: "#/components/schemas/GeoPoint" }
      responses:
        "200":
          description: "Updated driver status."
  /needs:
    get:
      tags: [Needs]
      operationId: listNearbyNeeds
      description: Seller view of open NGO needs whose service area covers the shop.
      responses:
        "200":
          description: "Up to 12 open needs with NGO name and distance."
  /ngo/needs:
    get:
      tags: [Needs]
      operationId: listMyNeeds
      responses:
        "200":
          description: "The NGO's needs, open first."
    post:
      tags: [Needs]
      operationId: createNeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, quantityKg, neededBy]
              properties:
                category: { $ref: "#/components/schemas/DonationCategory" }
                quantityKg: { type: number, exclusiveMinimum: 0 }
                neededBy: { type: string, format: date-time }
                notes: { type: string, maxLength: 300 }
      responses:
        "201":
          description: "Need created."
  /ngo/needs/{needId}/cancel:
    post:
      tags: [Needs]
      operationId: cancelNeed
      parameters:
        - { name: needId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "Need closed."
  /ngo/availability:
    get:
      tags: [Needs]
      operationId: getNgoAvailability
      responses:
        "200":
          description: "Receiving window and free capacity today."
    post:
      tags: [Needs]
      operationId: updateNgoAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receivingStart, receivingEnd, availableCapacityKg]
              properties:
                receivingStart: { type: string, example: "08:00" }
                receivingEnd: { type: string, example: "20:00" }
                availableCapacityKg: { type: number, minimum: 0 }
      responses:
        "200":
          description: "Updated availability."

  /admin/queues:
    get:
      tags: [Admin]
      operationId: getQueueDashboard
      responses:
        "200":
          description: Queue counts for the active MessageBus driver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/dead-letters:
    get:
      tags: [Admin]
      operationId: listDeadLetters
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: topic
          in: query
          schema:
            $ref: "#/components/schemas/QueueName"
      responses:
        "200":
          description: Unreplayed dead-letter messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/dead-letters/replay:
    post:
      tags: [Admin]
      operationId: replayDeadLetters
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayDeadLetterRequest"
      responses:
        "202":
          description: Selected messages were queued for replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayDeadLetterResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /stream:
    get:
      tags: [Events]
      operationId: streamEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: donationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |
            Server-sent event stream. Each `data` field contains a serialized
            DonationEvent and the event `id` is resumable.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    DemoUserHeader:
      type: apiKey
      in: header
      name: X-Demo-User
      description: Seeded demo user key. This is not production authentication.
    BearerSession:
      type: http
      scheme: bearer
      description: Session token from /auth/verify (phone sign-in).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DonationId:
      name: donationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NgoIdQuery:
      name: ngoId
      in: query
      required: false
      description: Must match the NGO selected by X-Demo-User when provided.
      schema:
        type: string
        format: uuid
    PickupId:
      name: pickupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CouponId:
      name: couponId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: X-Demo-User is absent, invalid, or not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist or is not visible to the demo user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Atomic state conflict or idempotency-key payload mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request failed schema or business validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Role:
      type: string
      enum: [seller, ngo, driver, partner]
    DonationCategory:
      type: string
      enum: [produce, bakery, dairy, prepared, pantry, other]
    DonationStatus:
      type: string
      enum:
        - posted
        - classified
        - offered
        - accepted
        - collected
        - delivered
        - expired
        - no_destination
    DonationUnit:
      type: string
      enum: [kg, unit, box, tray]
    OfferStatus:
      type: string
      enum: [pending, accepted, declined, timed_out, cancelled]
    PickupStatus:
