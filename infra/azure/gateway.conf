# Gateway for Azure Container Apps. Apps in the same environment are reached
# by name (http://api, http://web); ACA routes on the Host header, so the
# upstream name is kept as Host and the public host goes in X-Forwarded-Host.
limit_req_zone $binary_remote_addr zone=resgata_api:10m rate=30r/s;

map $http_x_correlation_id $resgata_correlation_id {
  default $http_x_correlation_id;
  "" $request_id;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  location = /_gateway/health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    proxy_set_header Host api;
    proxy_pass http://api/api/health;
  }

  location ~ ^/api/(stream|events)$ {
    proxy_set_header Host api;
    proxy_set_header Connection "";
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_pass http://api;
  }

  location /api/admin/ {
    limit_req zone=resgata_api burst=60 nodelay;
    rewrite ^/api/admin/(.*)$ /api/ops/$1 break;
    proxy_set_header Host api;
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
    proxy_pass http://api;
  }

  location /api/ {
    limit_req zone=resgata_api burst=60 nodelay;
    proxy_set_header Host api;
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
    proxy_read_timeout 120s;
    proxy_pass http://api;
  }

  location / {
    proxy_set_header Host web;
    proxy_pass http://web;
  }
}
