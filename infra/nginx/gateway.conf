limit_req_zone $binary_remote_addr zone=resgata_api:10m rate=30r/s;

map $http_x_correlation_id $resgata_correlation_id {
  default $http_x_correlation_id;
  "" $request_id;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 12m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $api_upstream http://api:80;
  set $web_upstream http://web:8080;

  location = /_gateway/health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    proxy_pass $api_upstream/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(stream|events)$ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
  }

  location /api/admin/ {
    limit_req zone=resgata_api burst=60 nodelay;
    rewrite ^/api/admin/(.*)$ /api/ops/$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
  }

  location /api/ {
    limit_req zone=resgata_api burst=60 nodelay;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $resgata_correlation_id;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
